version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./datasets:/app/datasets
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEVICE=cpu
    restart: unless-stopped
